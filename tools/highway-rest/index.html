<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國道休息站即時看板 (國道里程精準版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
    <a href="../../index.html" class="flex items-center text-slate-300 hover:text-white text-sm font-medium py-1 px-2.5 rounded-lg bg-slate-700/50 active:bg-slate-700">
      <i class="fa-solid fa-chevron-left mr-1.5"></i> 工具清單
    </a>
    <h1 class="text-base font-bold text-emerald-400 flex items-center gap-2">
      <i class="fa-solid fa-road"></i> 國道休息站看板
    </h1>
    <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-900/80 px-2.5 py-1 rounded-full border border-slate-700">
      <span id="traffic-status-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
      <span id="traffic-source-tag">等候連線...</span>
    </div>
  </header>

  <main class="flex-1 max-w-xl w-full mx-auto p-3 sm:p-5 space-y-4">

    <!-- 金鑰設定區塊 -->
    <details id="tdx-details" class="bg-slate-800 rounded-2xl border border-slate-700/80 p-3 text-xs text-slate-300">
      <summary class="font-bold cursor-pointer text-emerald-400 flex items-center justify-between">
        <span><i class="fa-solid fa-key mr-1"></i> 設定 TDX API 金鑰</span>
        <span class="text-[10px] bg-slate-700 px-2 py-0.5 rounded text-slate-300">點擊收合/展開</span>
      </summary>
      <div class="mt-3 space-y-2">
        <p class="text-slate-400">填入 Client ID 與 Client Secret 以取得即時局部最低速路況。</p>
        <div>
          <label class="block text-[11px] mb-1">Client ID:</label>
          <input type="text" id="tdx-client-id" placeholder="填入 Client ID" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
        </div>
        <div>
          <label class="block text-[11px] mb-1">Client Secret:</label>
          <input type="password" id="tdx-client-secret" placeholder="填入 Client Secret" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
        </div>
        <button onclick="saveTDXCredentials()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded text-xs transition active:scale-95">
          重新驗證並連線
        </button>
        <div id="tdx-error-log" class="text-[11px] text-red-400 hidden bg-red-950/40 p-2 rounded border border-red-800/50 break-all"></div>
      </div>
    </details>

    <section class="bg-slate-800 rounded-2xl p-4 border border-slate-700/80 shadow-xl space-y-4">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">國道編號</label>
          <select id="highway-select" onchange="onFilterChange()" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-base font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="1" selected>國道 1 號 (中山高)</option>
            <option value="3">國道 3 號 (福爾摩沙高)</option>
            <option value="5">國道 5 號 (蔣渭水高)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">行車方向</label>
          <select id="direction-select" onchange="onDirectionChange()" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-base font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="2" selected>南下</option>
            <option value="1">北上</option>
          </select>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-semibold text-slate-400">當前位置 (國道里程 K)</label>
          <button id="btn-gps" onclick="getLocationOnce()" class="flex items-center gap-1.5 text-xs bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-semibold active:bg-emerald-600/40">
            <i class="fa-solid fa-location-crosshairs"></i> GPS 自動對應 K 數
          </button>
        </div>
        
        <div class="flex items-center gap-2">
          <span class="text-2xl font-black text-slate-500">K</span>
          <input type="number" id="current-k" value="40" oninput="updateView()" class="w-full bg-slate-900 border border-slate-700 text-emerald-400 rounded-xl p-3 text-3xl font-black text-center focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-4 gap-2 mt-3">
          <button onclick="adjustK(-5)" class="py-3 bg-slate-700/60 active:bg-slate-600 text-slate-200 font-bold rounded-xl text-base">-5k</button>
          <button onclick="adjustK(-1)" class="py-3 bg-slate-700/60 active:bg-slate-600 text-slate-200 font-bold rounded-xl text-base">-1k</button>
          <button onclick="adjustK(1)" class="py-3 bg-slate-700/60 active:bg-slate-600 text-slate-200 font-bold rounded-xl text-base">+1k</button>
          <button onclick="adjustK(5)" class="py-3 bg-slate-700/60 active:bg-slate-600 text-slate-200 font-bold rounded-xl text-base">+5k</button>
        </div>
      </div>
    </section>

    <!-- 下一個休息站動態卡片 -->
    <section id="next-station-card" class="bg-slate-800 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden transition-all border border-slate-700">
      <div class="text-center py-4 text-slate-300">
        <i class="fa-solid fa-spinner fa-spin mr-2"></i> 正在載入路況資料...
      </div>
    </section>

    <!-- 後續休息站清單 -->
    <section class="bg-slate-800 rounded-2xl p-4 border border-slate-700/80 space-y-3">
      <h3 class="text-sm font-bold text-slate-400 flex items-center gap-2">
        <i class="fa-solid fa-list-ol"></i> 後續休息站預覽
      </h3>
      <div id="upcoming-list" class="space-y-2"></div>
    </section>
  </main>

  <script>
    const stationsData = {
      1: [
        { name: "中壢服務區", k: 55, dir: "both", lat: 24.9708, lng: 121.2298 },
        { name: "湖口服務區", k: 86, dir: "both", lat: 24.8966, lng: 121.0483 },
        { name: "泰安服務區", k: 158, dir: "both", lat: 24.3315, lng: 120.7222 },
        { name: "西螺服務區", k: 229, dir: "both", lat: 23.7744, lng: 120.4682 },
        { name: "新營服務區", k: 284, dir: "both", lat: 23.3276, lng: 120.2882 },
        { name: "仁德服務區", k: 316, dir: "both", lat: 22.9567, lng: 120.2520 }
      ],
      3: [
        { name: "木柵休息站", k: 25, dir: "north", lat: 24.9892, lng: 121.5832 },
        { name: "關西服務區", k: 55, dir: "both", lat: 24.8018, lng: 121.1895 },
        { name: "寶山休息站", k: 96, dir: "south", lat: 24.7562, lng: 120.9995 },
        { name: "西湖服務區", k: 135, dir: "both", lat: 24.5422, lng: 120.7610 },
        { name: "清水服務區", k: 172, dir: "both", lat: 24.2662, lng: 120.5702 },
        { name: "南投服務區", k: 224, dir: "both", lat: 23.9056, lng: 120.7088 },
        { name: "古坑服務區", k: 269, dir: "both", lat: 23.6338, lng: 120.5794 },
        { name: "東山服務區", k: 319, dir: "both", lat: 23.2381, lng: 120.4038 },
        { name: "關廟服務區", k: 363, dir: "both", lat: 22.9463, lng: 120.3292 }
      ],
      5: [
        { name: "石碇服務區", k: 4, dir: "both", lat: 24.9902, lng: 121.6421 },
        { name: "蘇澳服務區", k: 54, dir: "both", lat: 24.6062, lng: 121.8262 }
      ]
    };

    let currentDir = 'south';
    let tdxAccessToken = '';
    let isConnectedTDX = false;
    let mergedTrafficData = []; 

    document.addEventListener("DOMContentLoaded", () => {
      const savedId = localStorage.getItem('tdx_client_id') || '';
      const savedSecret = localStorage.getItem('tdx_client_secret') || '';
      if (savedId) document.getElementById('tdx-client-id').value = savedId;
      if (savedSecret) document.getElementById('tdx-client-secret').value = savedSecret;

      fetchAllTDXData();
    });

    function showErrorLog(msg) {
      const logDiv = document.getElementById('tdx-error-log');
      if (msg) {
        logDiv.innerText = msg;
        logDiv.classList.remove('hidden');
      } else {
        logDiv.classList.add('hidden');
      }
    }

    function saveTDXCredentials() {
      const id = document.getElementById('tdx-client-id').value.trim();
      const secret = document.getElementById('tdx-client-secret').value.trim();
      localStorage.setItem('tdx_client_id', id);
      localStorage.setItem('tdx_client_secret', secret);
      tdxAccessToken = ''; 
      fetchAllTDXData();
    }

    async function getTDXToken() {
      const clientId = localStorage.getItem('tdx_client_id');
      const clientSecret = localStorage.getItem('tdx_client_secret');

      if (!clientId || !clientSecret) {
        showErrorLog("尚未填入 Client ID 或 Secret");
        return null;
      }

      const tokenUrl = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
      const parameter = new URLSearchParams();
      parameter.append('grant_type', 'client_credentials');
      parameter.append('client_id', clientId);
      parameter.append('client_secret', clientSecret);

      try {
        const response = await fetch(tokenUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: parameter
        });

        if (!response.ok) {
          showErrorLog(`驗證失敗 HTTP ${response.status}`);
          return null;
        }

        const data = await response.json();
        showErrorLog('');
        return data.access_token || null;
      } catch (e) {
        showErrorLog("Token 連線失敗: " + e.message);
        return null;
      }
    }

    async function fetchAllTDXData() {
      const tag = document.getElementById('traffic-source-tag');
      const dot = document.getElementById('traffic-status-dot');

      tag.innerText = "正在同步最低速路況...";
      dot.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";

      tdxAccessToken = await getTDXToken();
      if (!tdxAccessToken) {
        isConnectedTDX = false;
        tag.innerText = "基本模式 (未連線 TDX)";
        dot.className = "w-2 h-2 rounded-full bg-slate-500";
        updateView();
        return;
      }

      const headers = { 'Accept': 'application/json', 'Authorization': `Bearer ${tdxAccessToken}` };
      let speedMap = {};

      try {
        const liveUrl = `https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/Live/Freeway?$format=JSON`;
        const liveRes = await fetch(liveUrl, { headers });
        
        if (liveRes.ok) {
          const lData = await liveRes.json();
          const rawList = Array.isArray(lData) ? lData : (lData.LiveTraffics || lData.Traffics || []);
          rawList.forEach(item => {
            const sId = String(item.SectionID || "");
            const spd = Number(item.TravelSpeed ?? item.AvgSpeed ?? -1);
            if (sId && spd > 0) speedMap[sId] = spd; // 嚴格過濾 0 與負數
          });
        }
      } catch (e) {
        console.warn("TDX API 讀取失敗:", e);
      }

      const highway = document.getElementById('highway-select').value;
      const directionSelect = document.getElementById('direction-select');
      const direction = directionSelect ? Number(directionSelect.value) : 2; 

      const mappingDatabase = {
        "1": {
          1: [
            { startK: 300, endK: 374, tdxIDs: ["0160", "0162", "0164", "0166", "0434", "0436", "0438", "0440"] },
            { startK: 250, endK: 299, tdxIDs: ["0168", "0170", "0172", "0174", "0176", "0178", "0491", "0492"] },
            { startK: 180, endK: 249, tdxIDs: ["0180", "0182", "0186", "0188", "0190", "0192", "0194", "0196"] },
            { startK: 130, endK: 179, tdxIDs: ["0198", "0200", "0202", "0204", "0206", "0470", "0210", "0212"] },
            { startK: 80, endK: 129, tdxIDs: ["0214", "0216", "0218", "0220", "0224", "0226", "0228", "0230"] },
            { startK: 40, endK: 79, tdxIDs: ["0232", "0234", "0236", "0238", "0242", "0244", "0246", "0248"] },
            { startK: 15, endK: 39, tdxIDs: ["0250", "0254", "0256", "0258", "0260", "0262", "0264", "0266"] },
            { startK: 0, endK: 14, tdxIDs: ["0268", "0270", "0272", "0274", "0412", "0276", "0278", "0280"] }
          ],
          2: [
            { startK: 0, endK: 39, tdxIDs: ["0159", "0161", "0163", "0165", "0433", "0435", "0437", "0439"] },
            { startK: 40, endK: 99, tdxIDs: ["0167", "0169", "0171", "0173", "0175", "0177", "0471", "0441"] },
            { startK: 100, endK: 179, tdxIDs: ["0179", "0181", "0185", "0187", "0189", "0191", "0193", "0195"] },
            { startK: 180, endK: 239, tdxIDs: ["0197", "0199", "0201", "0203", "0205", "0469", "0209", "0211"] },
            { startK: 240, endK: 299, tdxIDs: ["0213", "0215", "0217", "0219", "0221", "0223", "0225", "0227"] },
            { startK: 300, endK: 374, tdxIDs: ["0229", "0231", "0233", "0235", "0237", "0241", "0243", "0245"] }
          ]
        },
        "3": {
          1: [
            { startK: 280, endK: 430, tdxIDs: ["0001", "0003", "0005", "0007", "0011", "0013", "0015", "0017"] },
            { startK: 150, endK: 279, tdxIDs: ["0019", "0021", "0023", "0025", "0027", "0029", "0031", "0033", "0035", "0037"] },
            { startK: 60, endK: 149, tdxIDs: ["0039", "0041", "0043", "0045", "0047", "0049", "0053", "0055", "0057", "0059"] },
            { startK: 0, endK: 59, tdxIDs: ["0061", "0063", "0067", "0069", "0071", "0073", "0077", "0079", "0081", "0083"] }
          ],
          2: [
            { startK: 0, endK: 59, tdxIDs: ["0002", "0004", "0006", "0008", "0012", "0014", "0016", "0018", "0020", "0022"] },
            { startK: 60, endK: 179, tdxIDs: ["0024", "0026", "0028", "0030", "0032", "0034", "0036", "0038", "0040", "0042"] },
            { startK: 180, endK: 329, tdxIDs: ["0044", "0046", "0048", "0050", "0054", "0056", "0058", "0060", "0062", "0064"] },
            { startK: 330, endK: 430, tdxIDs: ["0068", "0070", "0072", "0074", "0078", "0080", "0082", "0084", "0086", "0088"] }
          ]
        },
        "5": {
          1: [{ startK: 0, endK: 60, tdxIDs: ["2131", "2132", "2133", "2134", "2135", "2136", "2137", "2138", "2139", "2140"] }],
          2: [{ startK: 0, endK: 60, tdxIDs: ["2255", "2256", "2275"] }]
        }
      };

      const highwayMap = mappingDatabase[highway] || mappingDatabase["3"];
      const targetSections = highwayMap[direction] || highwayMap[2];

      mergedTrafficData = targetSections.map(sec => {
        let validSpeeds = [];
        (sec.tdxIDs || []).forEach(id => {
          if (speedMap[id] !== undefined && speedMap[id] > 0) validSpeeds.push(speedMap[id]);
        });
        if (validSpeeds.length === 0) return null;
        return {
          startK: sec.startK,
          endK: sec.endK,
          speed: Math.round(validSpeeds.reduce((a, b) => a + b, 0) / validSpeeds.length),
          minSpeed: Math.min(...validSpeeds)
        };
      }).filter(Boolean);

      isConnectedTDX = true;
      tag.innerText = "TDX 最低速追蹤已啟用";
      dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";

      updateView();
    }

    function onFilterChange() { fetchAllTDXData(); }
    function onDirectionChange() {
      const dirVal = document.getElementById('direction-select').value;
      currentDir = (dirVal === '1') ? 'north' : 'south';
      fetchAllTDXData();
    }

    function adjustK(val) {
      const input = document.getElementById('current-k');
      let current = parseFloat(input.value) || 0;
      input.value = Math.max(0, current + val);
      updateView();
    }

    function getLocationOnce() {
      const btn = document.getElementById('btn-gps');
      if (!navigator.geolocation) {
        alert("您的裝置不支援 GPS 定位");
        return;
      }

      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 定位中...`;
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          
          // 💡 抓取當前選擇的國道編號 (1, 3, 5)
          const highway = document.getElementById('highway-select').value;
          const list = stationsData[highway] || [];

          // 嚴格依據該國道的休息站清單來計算距離
          let sortedByDist = [...list].map(s => ({
            ...s,
            dist: getDistanceInKm(userLat, userLng, s.lat, s.lng)
          })).sort((a, b) => a.dist - b.dist);

          if (sortedByDist.length >= 2) {
            const s1 = sortedByDist[0];
            const s2 = sortedByDist[1];

            // 根據該國道所選的休息站經緯度相對位置推估當前 K 數
            let estimatedK = Math.round((s1.k + s2.k) / 2);
            
            if (userLat < s1.lat) {
              estimatedK = s1.k - 5; 
            } else {
              estimatedK = s1.k + 5; 
            }

            estimatedK = Math.max(0, estimatedK);

            document.getElementById('current-k').value = estimatedK;
            updateView();
            btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> 已切換至國道 ${highway} 估算 K 數`;
          } else {
            btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> GPS 自動對應 K 數`;
          }

          setTimeout(() => {
            btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> GPS 自動對應 K 數`;
          }, 3000);
        },
        () => {
          alert("無法取得 GPS 位置，請確認手機已開啟定位權限。");
          btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> GPS 自動對應 K 數`;
        },
        { timeout: 8000, enableHighAccuracy: true }
      );
    }



    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getTrafficStatusByK(stationK) {
      if (!isConnectedTDX || mergedTrafficData.length === 0) return null;
      const matched = mergedTrafficData.find(sec => stationK >= sec.startK && stationK <= sec.endK) || mergedTrafficData[0];
      const checkSpeed = matched.minSpeed; // 採用局部最低速防呆

      let label = "順暢";
      let statusColor = "bg-emerald-500/20 text-emerald-300 border-emerald-500/30";

      if (checkSpeed < 40) {
        label = "局部嚴重壅塞";
        statusColor = "bg-purple-500/20 text-purple-300 border-purple-500/30";
      } else if (checkSpeed < 60) {
        label = "局部車多壅塞";
        statusColor = "bg-red-500/20 text-red-300 border-red-500/30";
      } else if (checkSpeed < 80) {
        label = "局部車流量大";
        statusColor = "bg-amber-500/20 text-amber-300 border-amber-500/30";
      }

      return { avgSpeed: matched.speed, minSpeed: matched.minSpeed, label, statusColor };
    }

    function updateView() {
      const highway = document.getElementById('highway-select').value;
      const currentK = parseFloat(document.getElementById('current-k').value) || 0;
      const list = stationsData[highway] || [];
      let validStations = list.filter(s => s.dir === 'both' || s.dir === currentDir);
      
      let upcoming = [];
      if(currentDir === 'south') {
        upcoming = validStations
          .filter(s => s.k > currentK)
          .map(s => {
            const dist = parseFloat((s.k - currentK).toFixed(1)); // 💡 嚴格用國道 K 數差計算距離，絕不亂跳
            const traffic = getTrafficStatusByK(s.k);
            const speedUsed = traffic ? traffic.minSpeed : 100;
            const mins = Math.max(1, Math.round((dist / speedUsed) * 60));
            return { ...s, dist, traffic, mins };
          })
          .sort((a,b) => a.k - b.k);
      } else {
        upcoming = validStations
          .filter(s => s.k < currentK)
          .map(s => {
            const dist = parseFloat((currentK - s.k).toFixed(1)); // 💡 嚴格用國道 K 數差計算距離
            const traffic = getTrafficStatusByK(s.k);
            const speedUsed = traffic ? traffic.minSpeed : 100;
            const mins = Math.max(1, Math.round((dist / speedUsed) * 60));
            return { ...s, dist, traffic, mins };
          })
          .sort((a,b) => b.k - a.k);
      }

      const card = document.getElementById('next-station-card');
      const listContainer = document.getElementById('upcoming-list');

      if (upcoming.length > 0) {
        const next = upcoming[0];
        const trafficBadge = next.traffic ? `
          <div class="flex flex-col items-end gap-1">
            <span class="px-2.5 py-1 text-xs font-bold rounded-full border ${next.traffic.statusColor}">
              ${next.traffic.label}
            </span>
            <span class="text-[11px] text-emerald-100 font-mono">
              均速 ${next.traffic.avgSpeed} / <strong class="text-white underline">最低 ${next.traffic.minSpeed} km/h</strong>
            </span>
          </div>
        ` : `<span class="px-2.5 py-1 text-xs rounded-full bg-slate-700 text-slate-300">未取得即時速</span>`;

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="text-xs font-bold uppercase tracking-wider text-emerald-200">Next Rest Area • 即將到達</div>
              <div class="text-3xl font-black mt-1 mb-1">${next.name} <span class="text-lg font-normal text-emerald-100">(${next.k}K)</span></div>
            </div>
            ${trafficBadge}
          </div>

          <div class="flex items-baseline gap-3 my-2">
            <div><span class="text-4xl font-extrabold">${next.dist}</span> <span class="text-sm">KM</span></div>
            <div class="text-slate-900 bg-white/90 px-3 py-1 rounded-full text-xs font-bold">
              ${next.traffic ? `即時路況保守估計 ~${next.mins} 分鐘` : `速限100km估算 ~${next.mins} 分鐘`}
            </div>
          </div>
        `;
        card.className = "bg-emerald-600 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden transition-all";

        if(upcoming.length > 1) {
          listContainer.innerHTML = upcoming.slice(1).map(s => {
            const tTag = s.traffic ? `
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] px-2 py-0.5 rounded border ${s.traffic.statusColor}">
                  ${s.traffic.label}
                </span>
                <span class="text-[10px] text-slate-400 font-mono">
                  (最慢 <strong class="text-slate-200">${s.traffic.minSpeed} km/h</strong>)
                </span>
              </div>
            ` : `<span class="text-[10px] px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-slate-400">速限 100km</span>`;

            return `
              <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-700/50 space-y-2">
                <div class="flex justify-between items-center">
                  <div class="font-bold text-white flex flex-col gap-1">
                    <span>${s.name}</span>
                    ${tTag}
                  </div>
                  <div class="text-right">
                    <span class="text-emerald-400 font-extrabold text-sm">${s.dist} km</span>
                    <span class="text-xs text-slate-400 ml-1">(~${s.mins} 分鐘)</span>
                  </div>
                </div>
                <div class="flex justify-between items-center text-xs text-slate-400 pt-1 border-t border-slate-800">
                  <span>里程：${s.k} K</span>
                </div>
              </div>
            `;
          }).join('');
        } else {
          listContainer.innerHTML = `<div class="text-xs text-slate-500 text-center py-2">無更多後續休息站</div>`;
        }
      } else {
        card.innerHTML = `
          <div class="text-lg font-bold">前方方向已無休息站</div>
          <div class="text-xs text-slate-200 mt-1">您已通過該國道當前方向的所有休息站。</div>
        `;
        card.className = "bg-slate-700 text-white rounded-2xl p-5 shadow-lg transition-all";
        listContainer.innerHTML = `<div class="text-xs text-slate-500 text-center py-2">--</div>`;
      }
    }
  </script>
</body>
</html>
