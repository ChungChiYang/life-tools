<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國道休息站即時看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
    <a href="../../index.html" class="flex items-center text-slate-300 hover:text-white text-sm font-medium py-1 px-2.5 rounded-lg bg-slate-700/50 active:bg-slate-700">
      <i class="fa-solid fa-chevron-left mr-1.5"></i> 工具清單
    </a>
    <h1 class="text-base font-bold text-emerald-400 flex items-center gap-2">
      <i class="fa-solid fa-road"></i> 休息站即時看板
    </h1>
    <div class="w-16"></div>
  </header>

  <main class="flex-1 max-w-xl w-full mx-auto p-3 sm:p-5 space-y-4">

    <!-- 控制面板卡片 -->
    <section class="bg-slate-800 rounded-2xl p-4 border border-slate-700/80 shadow-xl space-y-4">
      
      <!-- 國道選擇與南北向 -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">國道編號</label>
          <select id="highway-select" onchange="updateView()" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-base font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="1">國道 1 號 (中山高)</option>
            <option value="3" selected>國道 3 號 (福爾摩沙高)</option>
            <option value="5">國道 5 號 (蔣渭水高)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">行車方向</label>
          <div class="grid grid-cols-2 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-700">
            <button id="btn-south" onclick="setDirection('south')" class="py-2.5 rounded-lg text-sm font-bold transition-all bg-emerald-600 text-white">南下</button>
            <button id="btn-north" onclick="setDirection('north')" class="py-2.5 rounded-lg text-sm font-bold transition-all text-slate-400">北上</button>
          </div>
        </div>
      </div>

      <!-- 目前位置與單次 GPS 定位按鈕 -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-semibold text-slate-400">當前位置 (里程 K)</label>
          <!-- GPS 單次定位按鈕 -->
          <button id="btn-gps" onclick="getLocationOnce()" class="flex items-center gap-1.5 text-xs bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-semibold active:bg-emerald-600/40">
            <i class="fa-solid fa-location-crosshairs"></i> GPS 定位
          </button>
        </div>
        
        <div class="flex items-center gap-2">
          <span class="text-2xl font-black text-slate-500">K</span>
          <input type="number" id="current-k" value="70" oninput="updateView()" class="w-full bg-slate-900 border border-slate-700 text-emerald-400 rounded-xl p-3 text-3xl font-black text-center focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <!-- 手機大按鈕微調列 -->
        <div class="grid grid-cols-4 gap-2 mt-3">
          <button onclick="adjustK(-5)" class="py-3 bg-slate-700/60 active:bg-slate-600 text-slate-200 font-bold rounded-xl text-base">-5k</button>
          <button onclick="adjustK(-1)" class="py-3 bg-slate-700/60 active:bg-slate-600 text-slate-200 font-bold rounded-xl text-base">-1k</button>
          <button onclick="adjustK(1)" class="py-3 bg-slate-700/60 active:bg-slate-600 text-slate-200 font-bold rounded-xl text-base">+1k</button>
          <button onclick="adjustK(5)" class="py-3 bg-slate-700/60 active:bg-slate-600 text-slate-200 font-bold rounded-xl text-base">+5k</button>
        </div>
      </div>

    </section>

    <!-- 下一個休息站 Alert 區塊 -->
    <section id="next-station-card" class="bg-emerald-600 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden transition-all">
      <!-- JS 動態產生 -->
    </section>

    <!-- 後續休息站列表 -->
    <section class="bg-slate-800 rounded-2xl p-4 border border-slate-700/80 space-y-3">
      <h3 class="text-sm font-bold text-slate-400 flex items-center gap-2">
        <i class="fa-solid fa-list-ol"></i> 後續休息站預覽
      </h3>
      <div id="upcoming-list" class="space-y-2">
        <!-- JS 動態產生 -->
      </div>
    </section>

  </main>

  <script>
    // 包含 GPS 經緯度座標的休息站資料集
    const stationsData = {
      1: [
        { name: "中壢服務區", k: 55, dir: "both", lat: 24.9708, lng: 121.2298 },
        { name: "湖口服務區", k: 86, dir: "both", lat: 24.8966, lng: 121.0483 },
        { name: "泰安服務區", k: 158, dir: "both", lat: 24.3315, lng: 120.7222 },
        { name: "西螺服務區", k: 229, dir: "both", lat: 23.7744, lng: 120.4682 },
        { name: "新營服務區", k: 284, dir: "both", lat: 23.3276, lng: 120.2882 },
        { name: "仁德服務區", k: 316, dir: "both", lat: 22.9567, lng: 120.2520 }
      ],
      3: [
        { name: "木柵休息站", k: 25, dir: "north", lat: 24.9892, lng: 121.5832 },
        { name: "關西服務區", k: 55, dir: "both", lat: 24.8018, lng: 121.1895 },
        { name: "寶山休息站", k: 96, dir: "south", lat: 24.7562, lng: 120.9995 },
        { name: "西湖服務區", k: 135, dir: "both", lat: 24.5422, lng: 120.7610 },
        { name: "清水服務區", k: 172, dir: "both", lat: 24.2662, lng: 120.5702 },
        { name: "南投服務區", k: 224, dir: "both", lat: 23.9056, lng: 120.7088 },
        { name: "古坑服務區", k: 269, dir: "both", lat: 23.6338, lng: 120.5794 },
        { name: "東山服務區", k: 319, dir: "both", lat: 23.2381, lng: 120.4038 },
        { name: "關廟服務區", k: 363, dir: "both", lat: 22.9463, lng: 120.3292 }
      ],
      5: [
        { name: "石碇服務區", k: 4, dir: "both", lat: 24.9902, lng: 121.6421 },
        { name: "蘇澳服務區", k: 54, dir: "both", lat: 24.6062, lng: 121.8262 }
      ]
    };

    let currentDir = 'south';

    function setDirection(dir) {
      currentDir = dir;
      const btnSouth = document.getElementById('btn-south');
      const btnNorth = document.getElementById('btn-north');
      
      if(dir === 'south') {
        btnSouth.className = "py-2.5 rounded-lg text-sm font-bold transition-all bg-emerald-600 text-white";
        btnNorth.className = "py-2.5 rounded-lg text-sm font-bold transition-all text-slate-400";
      } else {
        btnNorth.className = "py-2.5 rounded-lg text-sm font-bold transition-all bg-emerald-600 text-white";
        btnSouth.className = "py-2.5 rounded-lg text-sm font-bold transition-all text-slate-400";
      }
      updateView();
    }

    function adjustK(val) {
      const input = document.getElementById('current-k');
      let current = parseFloat(input.value) || 0;
      input.value = Math.max(0, current + val);
      updateView();
    }

    // 單次 GPS 定位功能
    function getLocationOnce() {
      const btn = document.getElementById('btn-gps');
      if (!navigator.geolocation) {
        alert("您的裝置或瀏覽器不支援 GPS 定位");
        return;
      }

      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 定位中...`;
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const highway = document.getElementById('highway-select').value;
          const list = stationsData[highway] || [];

          let nearest = null;
          let minDistance = Infinity;

          // 尋找直線距離最近的休息站
          list.forEach(s => {
            const dist = getDistanceInKm(userLat, userLng, s.lat, s.lng);
            if (dist < minDistance) {
              minDistance = dist;
              nearest = s;
            }
          });

          if (nearest) {
            // 自動帶入該休息站里程 K 數（可再利用 +/-1k 做微調）
            document.getElementById('current-k').value = nearest.k;
            updateView();
            btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> 已定位`;
          } else {
            btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> GPS 定位`;
          }

          setTimeout(() => {
            btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> GPS 定位`;
          }, 3000);
        },
        (err) => {
          alert("無法取得 GPS 位置，請確認手機已開啟定位權限。");
          btn.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> GPS 定位`;
        },
        { timeout: 8000, enableHighAccuracy: true }
      );
    }

    // 計算兩經緯度點直線距離 (Haversine Formula)
    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateView() {
      const highway = document.getElementById('highway-select').value;
      const currentK = parseFloat(document.getElementById('current-k').value) || 0;
      
      const list = stationsData[highway] || [];
      let validStations = list.filter(s => s.dir === 'both' || s.dir === currentDir);
      
      let upcoming = [];
      if(currentDir === 'south') {
        upcoming = validStations
          .filter(s => s.k > currentK)
          .map(s => ({ ...s, dist: (s.k - currentK).toFixed(1) }))
          .sort((a,b) => a.k - b.k);
      } else {
        upcoming = validStations
          .filter(s => s.k < currentK)
          .map(s => ({ ...s, dist: (currentK - s.k).toFixed(1) }))
          .sort((a,b) => b.k - a.k);
      }

      const card = document.getElementById('next-station-card');
      if (upcoming.length > 0) {
        const next = upcoming[0];
        const mins = Math.round((next.dist / 100) * 60);
        card.innerHTML = `
          <div class="text-xs font-bold uppercase tracking-wider text-emerald-200">Next Rest Area • 即將到達</div>
          <div class="text-3xl font-black mt-1 mb-2">${next.name} <span class="text-lg font-normal text-emerald-100">(${next.k}K)</span></div>
          <div class="flex items-baseline gap-3">
            <div><span class="text-4xl font-extrabold">${next.dist}</span> <span class="text-sm">KM</span></div>
            <div class="text-slate-900 bg-white/90 px-3 py-1 rounded-full text-xs font-bold">預估 ~${mins} 分鐘</div>
          </div>
        `;
        card.className = "bg-emerald-600 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden transition-all";
      } else {
        card.innerHTML = `
          <div class="text-lg font-bold">前方方向已無休息站</div>
          <div class="text-xs text-slate-200 mt-1">您已通過該國道當前方向的所有休息站。</div>
        `;
        card.className = "bg-slate-700 text-white rounded-2xl p-5 shadow-lg transition-all";
      }

      const listContainer = document.getElementById('upcoming-list');
      if(upcoming.length > 1) {
        listContainer.innerHTML = upcoming.slice(1).map(s => `
          <div class="flex justify-between items-center p-3 bg-slate-900/60 rounded-xl border border-slate-700/50">
            <div>
              <div class="font-bold text-white">${s.name}</div>
              <div class="text-xs text-slate-400">${s.k} K</div>
            </div>
            <div class="text-right">
              <div class="text-emerald-400 font-extrabold">${s.dist} km</div>
              <div class="text-xs text-slate-500">~${Math.round((s.dist/100)*60)} 分鐘</div>
            </div>
          </div>
        `).join('');
      } else if(upcoming.length === 1) {
        listContainer.innerHTML = `<div class="text-xs text-slate-500 text-center py-2">無更多後續休息站</div>`;
      } else {
        listContainer.innerHTML = `<div class="text-xs text-slate-500 text-center py-2">--</div>`;
      }
    }

    updateView();
  </script>
</body>
</html>
